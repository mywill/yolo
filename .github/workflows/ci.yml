name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck bin/yolo setup-yolo.sh images/entrypoint.sh

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Run bats
        run: bats tests/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build base image
        run: ./setup-yolo.sh --install=no
      - name: Smoke-test container (claude)
        run: podman run --rm yolo-base claude --help
      - name: Smoke-test container (opencode)
        run: podman run --rm yolo-base opencode --help
      - name: Smoke-test container (pi)
        run: podman run --rm yolo-base pi --help
      - name: Smoke-test container (hermes)
        run: podman run --rm yolo-base hermes --version
      # codex smoke-test deferred — re-add once codex is re-enabled in the Dockerfile
      # - name: Smoke-test container (codex)
      #   run: podman run --rm yolo-base codex --help
